<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Envío de Vivero</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 500px;">
        <div class="card p-4 shadow-sm">
            <h3>✏️ Editar Envío de Vivero</h3>
            <form method="POST">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-warning w-100">Guardar Cambios</button>
            </form>
            <a href="{% url 'panel_pc' %}" class="btn btn-secondary w-100 mt-2">Cancelar</a>
        </div>
    </div>
</body>
</html>
