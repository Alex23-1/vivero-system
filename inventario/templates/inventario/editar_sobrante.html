<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Conteo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-4" style="max-width: 500px;">
        <div class="card p-4 shadow-sm">
            <h3>✏️ Modificar Conteo</h3>
            <form method="POST" class="mt-3">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="btn btn-primary w-100 py-2">Actualizar Conteo</button>
                <a href="{% url 'panel_celular' %}" class="btn btn-secondary w-100 mt-2 py-2">Cancelar</a>
            </form>
        </div>
    </div>
</body>
</html>
